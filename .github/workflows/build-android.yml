name: Build Android

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Tipo de artefato"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab
  push:
    tags:
      - "v*"

# Necessário para publicar o APK como asset quando o workflow for acionado por tag.
permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android ${{ github.event.inputs.artifact || 'apk' }}
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: 20
      JAVA_VERSION: 17
      # Aceita configuração em Repository variables ou Repository secrets.
      # A prioridade é: EXPO_PUBLIC_*, VITE_*, primeiro em variables, depois em secrets.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração do app
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || {
            echo "Falta configurar EXPO_PUBLIC_SUPABASE_URL (ou VITE_SUPABASE_URL) nas Variables/Secrets do repositório."
            exit 1
          }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || {
            echo "Falta configurar EXPO_PUBLIC_SUPABASE_ANON_KEY (ou VITE_SUPABASE_ANON_KEY) nas Variables/Secrets do repositório."
            exit 1
          }
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_SUPABASE_URL precisa começar com https://"; exit 1 ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Restore or generate keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          if [ -n "$KEYSTORE_B64" ]; then
            test -n "$KEY_ALIAS" || { echo "Falta o secret ANDROID_KEY_ALIAS."; exit 1; }
            test -n "$KEYSTORE_PASSWORD" || { echo "Falta o secret ANDROID_KEYSTORE_PASSWORD."; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "Falta o secret ANDROID_KEY_PASSWORD."; exit 1; }
            echo "$KEYSTORE_B64" | tr -d '\n' | base64 -d > android/app/release.keystore
            echo "USED_SECRET_KEYSTORE=true" >> "$GITHUB_ENV"
            {
              echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "Nenhum ANDROID_KEYSTORE_BASE64: gerando keystore temporário no CI."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cicicici -keypass cicicici \
              -dname "CN=Cesta Nacional, OU=CI, O=Cesta Nacional, L=Brasilia, ST=DF, C=BR"
            echo "USED_SECRET_KEYSTORE=false" >> "$GITHUB_ENV"
            {
              echo "MYAPP_UPLOAD_KEY_ALIAS=ci"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=cicicici"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=cicicici"
            } >> "$GITHUB_ENV"
          fi

      - name: Configure signing
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$MYAPP_UPLOAD_KEY_ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$MYAPP_UPLOAD_STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$MYAPP_UPLOAD_KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Aplicar signingConfig release
        run: node scripts/ci/prepare-android-release.mjs

      - name: Override versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        if: github.event.inputs.artifact != 'aab'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build AAB
        if: github.event.inputs.artifact == 'aab'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: github.event.inputs.artifact != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        if: github.event.inputs.artifact == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.artifact != 'aab'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
