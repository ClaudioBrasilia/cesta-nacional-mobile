name: Build Android

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Tipo de artefato'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android ${{ github.event.inputs.artifact || 'apk' }}
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: 20
      JAVA_VERSION: 17
      # Necessarias no prebuild: viram extra.supabaseUrl / extra.supabaseAnonKey
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar variaveis do app
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Falta a variable EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Falta a variable EXPO_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Restore or generate keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\n' | base64 -d > android/app/release.keystore
            echo "USED_SECRET_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "Nenhum ANDROID_KEYSTORE_BASE64: gerando keystore temporario no CI."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cicicici -keypass cicicici \
              -dname "CN=Cesta Nacional, OU=CI, O=Cesta Nacional, L=Brasilia, ST=DF, C=BR"
            echo "USED_SECRET_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Configure signing
        run: |
          if [ "$USED_SECRET_KEYSTORE" = "true" ]; then
            ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}'
            STOREPASS='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
            KEYPASS='${{ secrets.ANDROID_KEY_PASSWORD }}'
          else
            ALIAS=ci; STOREPASS=cicicici; KEYPASS=cicicici
          fi
          {
            echo ""
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STOREPASS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEYPASS"
          } >> android/gradle.properties

      - name: Aplicar signingConfig release
        run: node scripts/ci/prepare-android-release.mjs

      - name: Override versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        if: github.event.inputs.artifact != 'aab'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build AAB
        if: github.event.inputs.artifact == 'aab'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        if: github.event.inputs.artifact != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        if: github.event.inputs.artifact == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
